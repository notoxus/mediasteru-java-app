services:
  mediasteru:
    image: "${MEDIASTERU_IMAGE:-ghcr.io/notoxus/mediasteru:latest}"
    build:
      context: .
    container_name: mediasteru
    init: true
    restart: unless-stopped
    ports:
      - "${MEDIASTERU_HOST_PORT:-8765}:8765"
    environment:
      MEDIASTERU_CONTROL_TOKEN: "${MEDIASTERU_CONTROL_TOKEN:-}"
      MEDIASTERU_DEFAULT_FORMAT: "${MEDIASTERU_DEFAULT_FORMAT:-mp4}"
      MEDIASTERU_DEFAULT_QUALITY: "${MEDIASTERU_DEFAULT_QUALITY:-1080}"
      MEDIASTERU_UID: "${MEDIASTERU_UID:-}"
      MEDIASTERU_GID: "${MEDIASTERU_GID:-}"
    volumes:
      - mediasteru-data:/data
      - ./downloads:/downloads

volumes:
  mediasteru-data:
