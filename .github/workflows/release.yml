name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:

  # Build fat jar
  build-jar:
    name: Build fat JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js for consistency checks
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify tag, project version, and JRE alignment
        run: node scripts/check-project-versions.mjs --expected=${GITHUB_REF_NAME#v}

      - name: Sync version to tag
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i -E "s|(<finalName>MediaSteru-v)[0-9]+\.[0-9]+\.[0-9]+(</finalName>)|\1${VERSION}\2|" pom.xml
          sed -i -E "1,15s|(<version>)[^<]+(</version>)|\1${VERSION}\2|" pom.xml
          echo "version=${VERSION}" > src/main/resources/version.properties

      - name: Build fat JAR (skip assembly packages)
        run: mvn package -DskipDistributionAssembly=true --no-transfer-progress

      - name: Upload fat JAR
        uses: actions/upload-artifact@v5
        with:
          name: fat-jar
          path: target/*-jar-with-dependencies.jar
          retention-days: 1

  # Jlink for each runner native
  build-jre-windows:
    name: jlink – Windows x64
    runs-on: windows-latest
    needs: build-jar
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download fat JAR
        uses: actions/download-artifact@v5
        with:
          name: fat-jar
          path: target/

      - name: Run jlink
        shell: powershell
        run: |
          $modules = "java.se,jdk.httpserver,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.unsupported,jdk.zipfs,jdk.localedata,jdk.accessibility"
          Write-Host "Modules: $modules"
          jlink `
            --add-modules "$modules" `
            --strip-debug `
            --no-man-pages `
            --no-header-files `
            --compress=2 `
            --output tools/jre-win

      - name: Verify JRE
        run: tools\jre-win\bin\java.exe -version

      - name: Upload JRE artifact
        uses: actions/upload-artifact@v5
        with:
          name: jre-win
          path: tools/jre-win/
          retention-days: 1

  build-jre-mac-x64:
    name: jlink – macOS x64 (Intel)
    runs-on: macos-latest
    needs: build-jar
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21 x64 (Intel JDK via Rosetta 2)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64

      - name: Download fat JAR
        uses: actions/download-artifact@v5
        with:
          name: fat-jar
          path: target/

      - name: "Run jlink (output: Intel x64 JRE)"
        run: |
          MODULES="java.se,jdk.httpserver,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.unsupported,jdk.zipfs,jdk.localedata,jdk.accessibility"
          echo "Modules: $MODULES"
          jlink \
            --add-modules "$MODULES" \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2 \
            --output tools/jre-mac-x64

      - name: Verify JRE architecture
        run: |
          file tools/jre-mac-x64/bin/java
          tools/jre-mac-x64/bin/java -version

      - name: Upload JRE artifact
        uses: actions/upload-artifact@v5
        with:
          name: jre-mac-x64
          path: tools/jre-mac-x64/
          retention-days: 1

  build-jre-mac-arm:
    name: jlink – macOS ARM (Apple Silicon)
    runs-on: macos-latest
    needs: build-jar
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download fat JAR
        uses: actions/download-artifact@v5
        with:
          name: fat-jar
          path: target/

      - name: Run jlink
        run: |
          MODULES="java.se,jdk.httpserver,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.unsupported,jdk.zipfs,jdk.localedata,jdk.accessibility"
          echo "Modules: $MODULES"
          jlink \
            --add-modules "$MODULES" \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2 \
            --output tools/jre-mac-arm

      - name: Verify JRE
        run: tools/jre-mac-arm/bin/java -version

      - name: Upload JRE artifact
        uses: actions/upload-artifact@v5
        with:
          name: jre-mac-arm
          path: tools/jre-mac-arm/
          retention-days: 1

  build-jre-linux-x64:
    name: jlink – Linux x64
    runs-on: ubuntu-latest
    needs: build-jar
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download fat JAR
        uses: actions/download-artifact@v5
        with:
          name: fat-jar
          path: target/

      - name: Run jlink
        run: |
          MODULES="java.se,jdk.httpserver,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.unsupported,jdk.zipfs,jdk.localedata,jdk.accessibility"
          echo "Modules: $MODULES"
          jlink \
            --add-modules "$MODULES" \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2 \
            --output tools/jre-linux-x64

      - name: Verify JRE
        run: tools/jre-linux-x64/bin/java -version

      - name: Upload JRE artifact
        uses: actions/upload-artifact@v5
        with:
          name: jre-linux-x64
          path: tools/jre-linux-x64/
          retention-days: 1

  build-jre-linux-arm:
    name: jlink – Linux ARM64
    runs-on: ubuntu-24.04-arm
    needs: build-jar
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download fat JAR
        uses: actions/download-artifact@v5
        with:
          name: fat-jar
          path: target/

      - name: Run jlink
        run: |
          MODULES="java.se,jdk.httpserver,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.unsupported,jdk.zipfs,jdk.localedata,jdk.accessibility"
          echo "Modules: $MODULES"
          jlink \
            --add-modules "$MODULES" \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2 \
            --output tools/jre-linux-arm

      - name: Verify JRE
        run: tools/jre-linux-arm/bin/java -version

      - name: Upload JRE artifact
        uses: actions/upload-artifact@v5
        with:
          name: jre-linux-arm
          path: tools/jre-linux-arm/
          retention-days: 1

  # Create GitHub release
  package-and-release:
    name: Package & Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-jre-windows
      - build-jre-mac-x64
      - build-jre-mac-arm
      - build-jre-linux-x64
      - build-jre-linux-arm
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JRE – Windows
        uses: actions/download-artifact@v5
        with:
          name: jre-win
          path: tools/jre-win/

      - name: Download JRE – macOS x64
        uses: actions/download-artifact@v5
        with:
          name: jre-mac-x64
          path: tools/jre-mac-x64/

      - name: Download JRE – macOS ARM
        uses: actions/download-artifact@v5
        with:
          name: jre-mac-arm
          path: tools/jre-mac-arm/

      - name: Download JRE – Linux x64
        uses: actions/download-artifact@v5
        with:
          name: jre-linux-x64
          path: tools/jre-linux-x64/

      - name: Download JRE – Linux ARM
        uses: actions/download-artifact@v5
        with:
          name: jre-linux-arm
          path: tools/jre-linux-arm/

      - name: Set up Node.js for dependency synchronization
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Restore engine tool cache
        uses: actions/cache@v4
        with:
          path: |
            tools/yt-dlp*
            tools/ffmpeg*
            tools/deno*
          key: engine-tools-${{ hashFiles('tools-manifest.json') }}

      - name: Synchronize checksum-verified engine tools
        run: node scripts/sync-tools.mjs --all

      - name: Verify synchronized engine tools
        run: node scripts/sync-tools.mjs --all --check
      - name: Fix JRE permissions (Mac/Linux)
        run: |
          chmod -R +x tools/jre-mac-x64/bin/ tools/jre-mac-x64/lib/ || true
          chmod -R +x tools/jre-mac-arm/bin/ tools/jre-mac-arm/lib/ || true
          chmod -R +x tools/jre-linux-x64/bin/ tools/jre-linux-x64/lib/ || true
          chmod -R +x tools/jre-linux-arm/bin/ tools/jre-linux-arm/lib/ || true

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Sync pom.xml finalName to tag version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i -E "s|(<finalName>MediaSteru-v)[0-9]+\.[0-9]+\.[0-9]+(</finalName>)|\1${VERSION}\2|" pom.xml
          sed -i -E "1,15s|(<version>)[^<]+(</version>)|\1${VERSION}\2|" pom.xml

      - name: Build all desktop platform packages
        run: mvn package --no-transfer-progress

      - name: List generated packages
        run: ls -lh target/MediaSteru-*.zip target/MediaSteru-*.tar.gz

      - name: Create GitHub Release & upload desktop assets
        id: release
        uses: softprops/action-gh-release@v2.3.2
        with:
          name: "MediaSteru ${{ github.ref_name }}"
          draft: false
          generate_release_notes: true
          files: |
            target/MediaSteru-v${{ steps.version.outputs.VERSION }}-Win.zip
            target/MediaSteru-v${{ steps.version.outputs.VERSION }}-Mac-Intel.tar.gz
            target/MediaSteru-v${{ steps.version.outputs.VERSION }}-Mac-AppleSilicon.tar.gz
            target/MediaSteru-v${{ steps.version.outputs.VERSION }}-Linux-x64.tar.gz
            target/MediaSteru-v${{ steps.version.outputs.VERSION }}-Linux-ARM.tar.gz
