[package]
name = "mediasteru-cli"
version = "1.0.6"
edition = "2024"
description = "Keyboard-first terminal client for MediaSteru"
license = "MIT"
publish = false

[[bin]]
name = "mediasteru"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
